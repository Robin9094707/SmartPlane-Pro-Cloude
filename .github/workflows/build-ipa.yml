name: Build iOS IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SCHEME: SmartPlanePro
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Config/Info.plist

      - name: Build (Release, iphoneos, unsigned)
        run: |
          APP="build/Build/Products/Release-iphoneos/SmartPlanePro.app"
          if ! xcodebuild \
            -project SmartPlanePro.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1; then
            echo "::error::xcodebuild failed"
            grep -E "error:" build.log | sort -u | head -100
            tail -40 build.log
            exit 1
          fi
          echo "--- Warnings ---"
          grep -E "warning:" build.log | sort -u | head -100 || true
          # Xcode creates the bundle folder even for failed builds: verify the binary.
          test -x "$APP/SmartPlanePro" || { echo "::error::App binary missing"; exit 1; }
          ls -lh "$APP/SmartPlanePro"

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SmartPlanePro.app Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/SmartPlanePro.app/Info.plist)
          IPA="SmartPlanePro-${VERSION}-${{ github.run_number }}-unsigned.ipa"
          zip -qry "$IPA" Payload
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: SmartPlanePro-IPA
          path: ${{ env.IPA }}
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish rolling "latest" pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$IPA" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Neuester Build (#${{ github.run_number }})" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Unsignierte IPA – mit AltStore, SideStore, Sideloadly oder TrollStore installieren (siehe README)."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$IPA" --title "SmartPlane PRO $GITHUB_REF_NAME" --generate-notes
